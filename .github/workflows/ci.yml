name: CI

# The quality gate. The steps live in borba-tooling and are the make targets of
# this repository; see docs/standard.md there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib.yml@8eb43137340d48b038f0684492849470a4ecfa4f # v0.1.1
    with:
      postgres: false
      redis: false
      kafka: false
