name: Scheduled

# What changes without a commit: outdated dependencies, newly published
# vulnerabilities and new secret patterns. Findings arrive as a failed run or as
# the "Outdated dependencies" issue.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled:
    name: Scheduled
    uses: AF2B/borba-tooling/.github/workflows/clojure-lib-scheduled.yml@8eb43137340d48b038f0684492849470a4ecfa4f # v0.1.1
    permissions:
      contents: read
      issues: write
